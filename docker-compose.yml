services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # Migración V1→V2 completada. V1 desactivado.
      - TASKS_V1_DISABLED=true
      # SIG — URL interna del sig-backend para generación de PDF
      - SIG_BACKEND_URL=http://sig-backend:3003
      - SIG_PLATFORM_SLUG=${SIG_PLATFORM_SLUG:-logimat}
      # Nueva BD principal Python (reemplazará SQLite progresivamente)
      - ZYMO_DATABASE_URL=postgresql://${ZYMO_DB_USER:-zymo}:${ZYMO_DB_PASSWORD}@zymo-db:5432/${ZYMO_DB_NAME:-zymodb}
      # SIG DB — acceso de lectura para el agente RAG
      - SIG_DATABASE_URL=postgresql://${SIG_DB_USER:-sig}:${SIG_DB_PASSWORD}@sig-db:5432/${SIG_DB_NAME:-sigdb}
    volumes:
      - backend_data:/app/data
    depends_on:
      zymo-db:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "81:80"
    depends_on:
      - backend
    restart: unless-stopped

  zymo-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.agents.worker
    env_file:
      - ./backend/.env
    environment:
      - ZYMO_DATABASE_URL=postgresql://${ZYMO_DB_USER:-zymo}:${ZYMO_DB_PASSWORD}@zymo-db:5432/${ZYMO_DB_NAME:-zymodb}
      - SIG_DATABASE_URL=postgresql://${SIG_DB_USER:-sig}:${SIG_DB_PASSWORD}@sig-db:5432/${SIG_DB_NAME:-sigdb}
    volumes:
      - backend_data:/app/data
    restart: always
    depends_on:
      zymo-db:
        condition: service_healthy
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  helix-backend:
    build:
      context: ./helix-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env          # provides SECRET_KEY (same JWT secret that FastAPI uses)
    environment:
      # These override env_file values for helix-specific config:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${HELIX_DB_USER:-helix}:${HELIX_DB_PASSWORD}@helix-db:5432/${HELIX_DB_NAME:-helixdb}
      - INTRANET_API_URL=http://backend:8001
      - UPLOAD_DIR=/app/uploads
    volumes:
      - helix_uploads:/app/uploads
    depends_on:
      helix-db:
        condition: service_healthy
    restart: unless-stopped

  helix-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${HELIX_DB_USER:-helix}
      - POSTGRES_PASSWORD=${HELIX_DB_PASSWORD}
      - POSTGRES_DB=${HELIX_DB_NAME:-helixdb}
    volumes:
      - helix_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HELIX_DB_USER:-helix} -d ${HELIX_DB_NAME:-helixdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  task-backend:
    build:
      context: ./task-backend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env          # provides SECRET_KEY (same JWT secret that FastAPI uses)
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${TASK_DB_USER:-task}:${TASK_DB_PASSWORD}@task-db:5432/${TASK_DB_NAME:-taskdb}
      - INTRANET_API_URL=http://backend:8001
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:81}
      # Migration: path to V1 SQLite inside the container (read-only mount from backend_data)
      - V1_SQLITE_PATH=/app/data/intranet.db
      # Migration: same DATABASE_URL alias used by the Python script
      - V2_DATABASE_URL=postgresql://${TASK_DB_USER:-task}:${TASK_DB_PASSWORD}@task-db:5432/${TASK_DB_NAME:-taskdb}
    volumes:
      - task_uploads:/app/uploads
      - backend_data:/app/data:ro   # V1 SQLite (read-only — Python script reads, never writes)
    depends_on:
      task-db:
        condition: service_healthy
    restart: unless-stopped

  task-db:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${TASK_DB_USER:-task}
      - POSTGRES_PASSWORD=${TASK_DB_PASSWORD}
      - POSTGRES_DB=${TASK_DB_NAME:-taskdb}
    volumes:
      - task_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASK_DB_USER:-task} -d ${TASK_DB_NAME:-taskdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sig-backend:
    build:
      context: ./sig-backend
      dockerfile: Dockerfile
    ports:
      - "3004:3003"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://${SIG_DB_USER:-sig}:${SIG_DB_PASSWORD}@sig-db:5432/${SIG_DB_NAME:-sigdb}
      - INTRANET_API_URL=http://backend:8001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:81}
    depends_on:
      sig-db:
        condition: service_healthy
    volumes:
      - sig_uploads:/app/uploads/sig
    restart: unless-stopped

  sig-db:
    image: postgres:15-alpine
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=${SIG_DB_USER:-sig}
      - POSTGRES_PASSWORD=${SIG_DB_PASSWORD}
      - POSTGRES_DB=${SIG_DB_NAME:-sigdb}
    volumes:
      - sig_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIG_DB_USER:-sig} -d ${SIG_DB_NAME:-sigdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zymo-db:
    image: postgres:15-alpine
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_USER=${ZYMO_DB_USER:-zymo}
      - POSTGRES_PASSWORD=${ZYMO_DB_PASSWORD}
      - POSTGRES_DB=${ZYMO_DB_NAME:-zymodb}
    volumes:
      - zymo_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZYMO_DB_USER:-zymo} -d ${ZYMO_DB_NAME:-zymodb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_data:
  helix_db_data:
  helix_uploads:
  task_db_data:
  task_uploads:
  sig_db_data:
  sig_uploads:
  zymo_db_data:
