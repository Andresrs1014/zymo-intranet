services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "81:80"
    depends_on:
      - backend
    restart: unless-stopped

  zymo-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.agents.worker
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    restart: always
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  helix-backend:
    build:
      context: ./helix-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://helix:helixpass@helix-db:5432/helixdb
      - JWT_SECRET=${JWT_SECRET}
      - INTRANET_API_URL=http://backend:8001
      - INTERNAL_KEY=${INTERNAL_KEY:-helix-internal-key}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - helix_uploads:/app/uploads
    depends_on:
      - helix-db
    restart: unless-stopped

  helix-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=helix
      - POSTGRES_PASSWORD=helixpass
      - POSTGRES_DB=helixdb
    volumes:
      - helix_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  backend_data:
  helix_db_data:
  helix_uploads:
