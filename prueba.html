<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYMO | Minimalist Intranet</title>
    <style>
        /* CSS variables para el sistema de diseño minimalista */
        :root {
            /* ZYMO Brand */
            --zymo-red: #C3182A;
            --zymo-red-light: #FEE2E2;
            
            /* Neutrals (Basado en escala Slate/Zinc) */
            --bg-base: #FFFFFF;
            --bg-muted: #F4F4F5;
            --bg-hover: #F4F4F5;
            --border-subtle: #E4E4E7;
            
            /* Typography */
            --text-main: #09090B;
            --text-muted: #71717A;
            
            /* Transitions */
            --transition-fast: 0.15s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 0.875rem; /* 14px - Tamaño corporativo estándar */
        }

        /* ============================
           SIDEBAR (Shadcn Pattern)
        ============================ */
        .sidebar {
            width: 260px;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 1rem 0.75rem;
            flex-shrink: 0;
        }

        /* Workspace Switcher */
        .workspace-switcher {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background var(--transition-fast);
            margin-bottom: 1.5rem;
        }
        .workspace-switcher:hover { background-color: var(--bg-hover); }
        
        .workspace-logo {
            width: 32px; height: 32px;
            background-color: var(--zymo-red);
            border-radius: 0.375rem;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
        }
        .workspace-info { flex: 1; }
        .workspace-name { font-weight: 600; font-size: 0.875rem; }
        .workspace-plan { font-size: 0.75rem; color: var(--text-muted); }

        /* Navegación */
        .nav-section { margin-bottom: 1.5rem; }
        .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0 0.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.375rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition-fast);
            min-height: 44px; /* WCAG Target Size para operabilidad */
            cursor: pointer;
        }

        .nav-item svg { width: 18px; height: 18px; stroke-width: 2px; }
        
        /* Efecto Hover Minimalista */
        .nav-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        /* Estado Activo con Rojo ZYMO */
        .nav-item.active {
            background-color: var(--zymo-red-light);
            color: var(--zymo-red);
        }

        /* Usuario al pie */
        .user-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        .user-footer:hover { background-color: var(--bg-hover); }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background-color: var(--border-subtle); }

        /* ============================
           MAIN CONTENT & TOPBAR
        ============================ */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-muted); /* Separación visual del sidebar */
            overflow: hidden;
        }

        .topbar {
            height: 56px;
            background-color: var(--bg-base);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        /* Buscador Comando (Cmd+K) */
        .search-command {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-muted);
            border: 1px solid transparent;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            color: var(--text-muted);
            width: 280px;
            cursor: text;
            transition: border-color var(--transition-fast);
        }
        .search-command:focus-within {
            border-color: var(--zymo-red);
            background-color: var(--bg-base);
        }
        .search-command input {
            border: none; background: transparent; outline: none; width: 100%;
            color: var(--text-main); font-size: 0.875rem;
        }
        .kbd-shortcut {
            font-size: 0.7rem; background-color: var(--bg-base);
            padding: 0.1rem 0.3rem; border-radius: 0.25rem; border: 1px solid var(--border-subtle);
        }

        .main-content {
            padding: 2rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Headers y Botones Elegantes */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }

        .btn-primary {
            background-color: var(--zymo-red);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color var(--transition-fast);
            min-height: 40px;
        }
        .btn-primary:hover { background-color: #A01220; }

    </style>
</head>
<body>

    <!-- ÁREA PRINCIPAL -->

        <!-- Topbar con Búsqueda -->
