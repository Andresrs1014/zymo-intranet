server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de archivos grandes (PDFs, imágenes, Excel)
    client_max_body_size 25m;

    # Proxy al helix-backend (Node.js) — evita mixed-content y firewall en puerto 3001
    location /helix-api/ {
        proxy_pass http://helix-backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support (Chat IA)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Archivos subidos (evidencias) — servidos directamente por helix-backend
    location /uploads/ {
        proxy_pass http://helix-backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy al backend — cubre todos los prefijos de rutas FastAPI
    location ~ ^/(api|auth|users|roles|areas|sedes|oc|sgc|financiero|agentes|zymo|gerencial|borradores|admin|herramientas-tareas|health)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — todas las rutas sirven index.html (nunca cachear el HTML)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
