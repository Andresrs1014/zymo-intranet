server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de archivos grandes (PDFs, imágenes, Excel)
    client_max_body_size 25m;

    # Proxy al backend — cubre todos los prefijos de rutas FastAPI
    location ~ ^/(api|auth|users|roles|areas|sedes)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA — todas las rutas sirven index.html (nunca cachear el HTML)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
