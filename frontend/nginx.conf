server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los backends viven en contenedores que se recrean (cada rebuild les cambia la IP). Con un
    # `proxy_pass http://host:puerto` literal, nginx resuelve el nombre UNA vez al arrancar y sigue
    # llamando a la IP vieja -> 502 hasta reiniciar el frontend (pasó el 2026-10-01 con sig).
    # Con variable + resolver de Docker, se vuelve a resolver solo (cada 10 s).
    # OJO: con variable, nginx ya no quita el prefijo solo: por eso cada bloque lleva su `rewrite`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $task_up  http://task-backend:3002;
    set $sig_up   http://sig-backend:3003;
    set $zally_up http://zymoally-backend:3005;
    set $lib_up   http://libertadora-backend:3006;
    set $py_up    http://backend:8001;

    # Permitir subida de archivos grandes (PDFs, imágenes, Excel)
    client_max_body_size 25m;

    # Proxy al task-backend V2 (Node.js — puerto 3002)
    location /tareas-api/ {
        rewrite ^/tareas-api/(.*)$ /$1 break;
        proxy_pass $task_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Archivos subidos en Tareas V2
    location /tareas-uploads/ {
        rewrite ^/tareas-uploads/(.*)$ /uploads/$1 break;
        proxy_pass $task_up;
        proxy_set_header Host $host;
    }

    # Proxy al sig-backend (Node.js — puerto 3003)
    location /sig-api/ {
        rewrite ^/sig-api/(.*)$ /$1 break;
        proxy_pass $sig_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        # Markdown puede ser grande
        client_max_body_size 15m;
    }

    # Proxy al zymoally-backend (Node.js — puerto 3005)
    location /zymoally-api/ {
        rewrite ^/zymoally-api/(.*)$ /$1 break;
        proxy_pass $zally_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Evidencias subidas en Zymo Ally
    location /zymoally-uploads/ {
        rewrite ^/zymoally-uploads/(.*)$ /uploads/$1 break;
        proxy_pass $zally_up;
        proxy_set_header Host $host;
    }

    # Links cortos de Zymo Ally (ej. "Enviar encuesta") — path corto a propósito,
    # queda en la raíz del dominio en vez de /zymoally-api/s/...
    location ^~ /s/ {
        proxy_pass $zally_up;   # /s/... llega igual
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy al libertadora-backend (Node.js — puerto 3006). Incluye /public/...
    # (login y CRUD del socio externo Skandia) además de /api/... (staff interno).
    location /libertadora-api/ {
        rewrite ^/libertadora-api/(.*)$ /$1 break;
        proxy_pass $lib_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Archivos T&C (fotos, manuales) — servidos por el backend Python
    location ^~ /tc-manuales/ {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /tc-fotos/ {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /tc-docs/ {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;
    }

    # Logos de plataforma embebidos en correos OC (ver email_service.py::_logo_url)
    location ^~ /oc-logos/ {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/operativo/(clientes|personas|cargos)(/|$) {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # T&C API — solo los sub-paths que son endpoints del backend Python
    # Las rutas SPA (/tc, /tc/directorio, /tc/persona/:id, /tc/organigrama)
    # caen al bloque location / y sirven index.html correctamente.
    location ~ ^/tc/(stats|empresas|plataformas|areas-sedes|areas|cargos-sig|cargos|personas|import|capacitaciones|evaluaciones|sanciones|novedades|kpis|organigrama-arbol|eventos|agenda|cap-coordinador|paquetes|smtp-config|wa-config|clientes|formatos-api|evaluaciones-desempeno|aprobaciones-api|config)(/|$) {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /tc/empresa/:sedeId es ruta SPA (Hub por empresa) — solo estos sub-paths son API real.
    location ~ ^/tc/empresa/\d+/(hub|areas-activas|areas) {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/tc/organigrama/\d {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tc/eventos/\d {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Proxy al backend — cubre todos los prefijos de rutas FastAPI
    location ~ ^/(api|auth|users|roles|areas|sedes|health)(/|$) {
        proxy_pass $py_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — todas las rutas sirven index.html (nunca cachear el HTML)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
