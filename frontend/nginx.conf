server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de archivos grandes (PDFs, imágenes, Excel)
    client_max_body_size 25m;

    # Proxy al helix-backend (Node.js) — evita mixed-content y firewall en puerto 3001
    location /helix-api/ {
        proxy_pass http://helix-backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support (Chat IA)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Archivos subidos (evidencias) — servidos directamente por helix-backend
    location /uploads/ {
        proxy_pass http://helix-backend:3001/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy al task-backend V2 (Node.js — puerto 3002)
    location /tareas-api/ {
        proxy_pass http://task-backend:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Archivos subidos en Tareas V2
    location /tareas-uploads/ {
        proxy_pass http://task-backend:3002/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy al sig-backend (Node.js — puerto 3003)
    location /sig-api/ {
        proxy_pass http://sig-backend:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        # Markdown puede ser grande
        client_max_body_size 15m;
    }

    # Proxy al zymoally-backend (Node.js — puerto 3005)
    location /zymoally-api/ {
        proxy_pass http://zymoally-backend:3005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Evidencias subidas en Zymo Ally
    location /zymoally-uploads/ {
        proxy_pass http://zymoally-backend:3005/uploads/;
        proxy_set_header Host $host;
    }

    # Links cortos de Zymo Ally (ej. "Enviar encuesta") — path corto a propósito,
    # queda en la raíz del dominio en vez de /zymoally-api/s/...
    location ^~ /s/ {
        proxy_pass http://zymoally-backend:3005/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Análisis NetVault — timeout largo (Claude puede tardar 2-3 min en documentos grandes)
    location /api/netvault/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Archivos T&C (fotos, manuales) — servidos por el backend Python
    location ^~ /tc-manuales/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /tc-fotos/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /tc-docs/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;
    }

    location ~ ^/operativo/clientes(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # T&C API — solo los sub-paths que son endpoints del backend Python
    # Las rutas SPA (/tc, /tc/directorio, /tc/persona/:id, /tc/organigrama)
    # caen al bloque location / y sirven index.html correctamente.
    location ~ ^/tc/(stats|empresas|plataformas|areas-sedes|areas|cargos-sig|cargos|personas|import|capacitaciones|evaluaciones|sanciones|novedades|kpis|organigrama-arbol|eventos|agenda|cap-coordinador|paquetes|smtp-config|wa-config|clientes|formatos-api)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /tc/empresa/:sedeId es ruta SPA (Hub por empresa) — solo estos sub-paths son API real.
    location ~ ^/tc/empresa/\d+/(hub|areas-activas|areas) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/tc/organigrama/\d {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tc/eventos/\d {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Proxy al backend — cubre todos los prefijos de rutas FastAPI
    location ~ ^/(api|auth|users|roles|areas|sedes|health)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — todas las rutas sirven index.html (nunca cachear el HTML)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
